name: ci

# This runs after the merge, not on the pull request. A merge to main runs the
# tests here, and a merge that passes them is tagged and released in the same
# run, so a tag only ever comes from a green tree. Nothing gates a PR before
# it is merged: the merge is what starts this.
#
# Pushing a tag by hand (`git push origin v1.2.3`) takes the same path with the
# version you chose instead of inventing one.
#
# A manual run (`gh workflow run ci.yml -f tag=v1.2.3`) republishes one tag
# without bumping anything: the lever for repairing a release that came out
# wrong, since such a tag would otherwise never be picked again.
#
# A merge with no label gets a patch bump; the merged PR's labels decide
# otherwise:
#
#   release:major   v1.2.3 -> v2.0.0
#   release:minor   v1.2.3 -> v1.3.0
#   release:patch   v1.2.3 -> v1.2.4   (also the default)
#   skip-release    publish nothing for this merge
#
# The tag is pushed with the workflow's own token, which by design does not
# start another workflow run — so publishing happens here, not in a
# tag-triggered job.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish, e.g. v0.2.1. Empty derives the next version."
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The release job cross-compiles all four targets; catching a broken
      # one here keeps it from surfacing only after the merge.
      - name: Cross-compile
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null ./cmd/cpa
          done

  # Both triggers are release occasions — a merge to main, or a tag pushed by
  # hand — so this job carries no ref guard of its own: `needs: test` is the
  # whole condition.
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags: the version bump reads them, and --generate-notes needs the
          # previous one to write its range.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # A manual run names the tag to republish, so repairing a release
          # does not cost a version number.
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=${INPUT_TAG}" >>"$GITHUB_OUTPUT"
            echo "manual run for ${INPUT_TAG}"
            exit 0
          fi

          # A tag pushed by hand names the version itself.
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # Re-running this job must not invent a second version for a commit
          # that has already been released.
          already="$(git tag --points-at "$SHA" --list 'v*' | head -n1)"
          if [ -n "$already" ]; then
            echo "tag=$already" >>"$GITHUB_OUTPUT"
            echo "${SHA:0:7} is already ${already}"
            exit 0
          fi

          labels=""
          pr="$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$pr" ]; then
            labels="$(gh api "repos/${REPO}/pulls/${pr}" \
              --jq '.labels[].name' 2>/dev/null || true)"
          fi

          if grep -qx 'skip-release' <<<"$labels"; then
            echo "skip=1" >>"$GITHUB_OUTPUT"
            echo "skip-release label: publishing nothing for ${SHA:0:7}"
            exit 0
          fi

          bump=patch
          if grep -qx 'release:minor' <<<"$labels"; then bump=minor; fi
          if grep -qx 'release:major' <<<"$labels"; then bump=major; fi

          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          echo "tag=v${major}.${minor}.${patch}" >>"$GITHUB_OUTPUT"
          echo "${latest} + ${bump} -> v${major}.${minor}.${patch}"

      - name: Build archives
        if: steps.version.outputs.skip != '1'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          # Stage each tree contents in their own directory: a bare
          # `rm -rf dist/cpa_*` would also match the .tar.gz files.
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="cpa_${ver}_${os}_${arch}"
            mkdir -p "dist/stage/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "dist/stage/${name}/cpa" ./cmd/cpa
            cp README.md README.zh-CN.md LICENSE "dist/stage/${name}/"
            cp -R examples "dist/stage/${name}/"
            tar -C dist/stage -czf "dist/${name}.tar.gz" "${name}"
          done
          rm -rf dist/stage
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Tag and publish
        if: steps.version.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          assets=(dist/*.tar.gz dist/checksums.txt install.sh)
          expected=()
          for f in "${assets[@]}"; do
            if [ ! -f "$f" ]; then
              echo "no ${f} to publish"
              exit 1
            fi
            expected+=("$(basename "$f")")
          done

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "${TAG}" "$SHA"
            git push origin "${TAG}"
          fi

          # The release and its assets are two calls on purpose. `gh release
          # create <tag> <assets>` uploads the files in its own requests and can
          # report success having attached none of them - that is how v0.2.1 was
          # published empty - so the upload is its own call here, and the assets
          # are counted before this step is allowed to pass.
          draft=false
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
            draft=true
          elif [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            draft=true
            echo "release ${TAG} is still a draft from an earlier run; finishing it"
          else
            echo "release ${TAG} is already published; checking its assets"
          fi

          gh release upload "$TAG" --clobber "${assets[@]}"

          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=()
          for name in "${expected[@]}"; do
            grep -qxF "$name" <<<"$have" || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "these assets did not attach to ${TAG}:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          # A draft is invisible to /releases/latest, the endpoint cpa upgrade
          # reads, so anything that goes wrong before this line leaves the
          # previous release as the one people get.
          if [ "$draft" = true ]; then
            gh release edit "$TAG" --draft=false
          fi
          echo "published ${TAG} with ${#expected[@]} assets"
