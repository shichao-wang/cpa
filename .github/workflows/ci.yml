name: ci

# Validate pull requests before merging. Require the `test` status check in
# main's branch protection to block a failing PR. Releases use release.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Catch broken release targets before merging.
      - name: Cross-compile
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -o /dev/null ./cmd/cpa
          done
