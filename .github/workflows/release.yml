name: release

# Pushing a tag like v0.1.0 builds, tests, and publishes the archives that
# install.sh downloads. Nothing is published until the tests pass.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          gofmt -l . | tee /tmp/fmt
          test ! -s /tmp/fmt
          go vet ./...
          go test ./...

      - name: Build archives
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          mkdir -p dist
          # Stage tree contents in their own directory: a bare
          # `rm -rf dist/cpa_*` would also match the .tar.gz files.
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="cpa_${ver}_${os}_${arch}"
            mkdir -p "dist/stage/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${tag}" \
              -o "dist/stage/${name}/cpa" ./cmd/cpa
            cp README.md README.zh-CN.md LICENSE "dist/stage/${name}/"
            tar -C dist/stage -czf "dist/${name}.tar.gz" "${name}"
          done
          rm -rf dist/stage
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt install.sh
