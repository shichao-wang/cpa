    public_model: claude-REPLACE-WITH-OFFICIAL-PUBLIC-ID-OPUS
    connection: example
    target_model: REPLACE-WITH-UPSTREAM-MODEL-ID
  sonnet:
    public_model: claude-REPLACE-WITH-OFFICIAL-PUBLIC-ID-SONNET
    connection: example
    target_model: REPLACE-WITH-UPSTREAM-MODEL-ID
  haiku:
    public_model: claude-REPLACE-WITH-OFFICIAL-PUBLIC-ID-HAIKU
    connection: example
    target_model: REPLACE-WITH-UPSTREAM-MODEL-ID
